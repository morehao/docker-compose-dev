# RabbitMQ 单节点开发配置
#
# 官方镜像会把 /etc/rabbitmq/rabbitmq.conf 当作主配置加载。
# 注意：默认用户/密码由 compose 的 RABBITMQ_DEFAULT_* 环境变量注入，
# 这里不要再写 default_user / default_pass / default_vhost，
# 否则和入口脚本生成的配置重复（duplicate key），容器会启动失败。

# 内存告警阈值：达到容器内存的 60% 后阻塞 publisher（消费端不受影响）。
# 本地机器紧张时可下调到 0.4；4.4 起不能用环境变量设置，只能写在配置文件里。
vm_memory_high_watermark.relative = 0.6

# 磁盘空闲告警阈值。
# 默认按磁盘剩余比例计算，开发机磁盘很大时算出来的绝对值偏大，容易莫名触发告警；
# 单机开发固定 1GB 就够了。
disk_free_limit.absolute = 1GB

# 消费确认超时。
# 默认 30 分钟，本地断点调试或慢消费时容易被强制断开并反复重投；
# 放宽到 2 小时，避免开发时被误伤。
consumer_timeout = 7200000
