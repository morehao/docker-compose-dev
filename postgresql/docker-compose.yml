services:
  postgres18:
    image: postgres:18.4
    container_name: postgres18
    ports:
      - "5432:5432"
    volumes:
      - ./data:/var/lib/postgresql
    environment:
      POSTGRES_PASSWORD: 123456
    networks:
      - local_net
    restart: unless-stopped

networks:
  local_net:
    external: true

