services:
  rustfs:
    image: rustfs/rustfs:latest
    container_name: rustfs
    # host 网络：容器与 Mac 共用网络栈，容器内的 localhost:8100 就是宿主机上的 ark-iam gateway。
    # 于是 OIDC issuer 可以用 http://localhost:8100/oidc —— 浏览器侧只走 loopback（不经过系统代理、
    # 不受私网 IP 拦截影响），且 SSO 会话 cookie 与 localhost:4000 的登录页同源，可与 Gitea 共享免密会话。
    # 代价：不能再写 ports: 端口映射，S3 API / 控制台直接监听宿主 9010/9011；也不再加入 local_net。
    network_mode: host
    volumes:
      - ./data:/data
    environment:
      RUSTFS_VOLUMES: /data/rustfs0
      RUSTFS_ADDRESS: 0.0.0.0:9010            # 宿主 9010 = S3 API
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9011    # 宿主 9011 = 控制台
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      RUSTFS_OBS_LOGGER_LEVEL: info

      # ark-iam 在宿主机 loopback，OIDC discovery/JWKS/token 属出站 Full policy：
      # loopback 属「可被白名单覆盖」的类别，但仍须登记精确 origin（scheme://host:port，不带路径）；
      # 该配置启动时读取一次，改后要重建容器。
      RUSTFS_OUTBOUND_ALLOW_ORIGINS: ${ARK_IAM_ORIGIN:-http://localhost:8100}

      # --- OIDC 提供方（env 组无后缀 = 提供方 ID "default"）---
      # 整组必须一次配全：config_url 为空时这组 env 会被整体丢弃（crates/iam/src/oidc.rs:1815），
      # 所以 client_id/secret/redirect 一并写在这里，不要指望只补其中一项。
      # 不写 RUSTFS_IDENTITY_OPENID_ENABLE：该键为空时默认启用（crates/iam/src/oidc.rs:1819）；
      # 字面量写错反而会被解析成停用。同名提供方 env 组覆盖控制台里的持久化配置（merge 时 env 优先）。
      RUSTFS_IDENTITY_OPENID_CONFIG_URL: ${ARK_IAM_ORIGIN:-http://localhost:8100}/oidc/.well-known/openid-configuration
      RUSTFS_IDENTITY_OPENID_CLIENT_ID: "rustfs_console"
      # 明文来自 ark-iam 平台控制台 rustfs_console 详情页「密钥管理」（只显示一次），存 rustfs/.env（已 gitignore）
      RUSTFS_IDENTITY_OPENID_CLIENT_SECRET: ${RUSTFS_OIDC_CLIENT_SECRET:?未设置 RUSTFS_OIDC_CLIENT_SECRET：先 cp .env.example .env 并按 README「Ark IAM 侧准备」填入}
      RUSTFS_IDENTITY_OPENID_SCOPES: "openid,profile,email"
      RUSTFS_IDENTITY_OPENID_REDIRECT_URI: "http://localhost:9011/rustfs/admin/v3/oidc/callback/default"
      # 该键为空时默认值也是「开」= 允许动态 redirect_uri（crates/iam/src/oidc.rs:1836），
      # 必须显式关掉，否则任意回调地址都会被接受。
      RUSTFS_IDENTITY_OPENID_REDIRECT_URI_DYNAMIC: "off"
      RUSTFS_IDENTITY_OPENID_DISPLAY_NAME: "Ark IAM"
      # 策略名 = claim_prefix + groups 值，纯字符串拼接、无映射表（crates/iam/src/oidc.rs:1508）。
      # 前缀做跨产品命名空间隔离：只能命中存储侧 iam_ 前缀的策略，避免下游其它产品造同名策略借权。
      # 前缀隔离不了「同一租户里不同应用之间」——那由 ark-iam 侧两层保证：groups 只下发
      # rustfs_console 所属 rustfs_local 应用的角色，且编码只由该应用的「角色模板」定义
      # （租户自建角色编码恒为空串、不参与 groups，见 docs/design/application-integration-guide.md §3.4）。
      RUSTFS_IDENTITY_OPENID_CLAIM_PREFIX: "iam_"
      RUSTFS_IDENTITY_OPENID_GROUPS_CLAIM: "groups"
      # 不设 RUSTFS_IDENTITY_OPENID_ROLE_POLICY：它与 claim 映射互斥，一旦设置，groups 只会作为
      # 「组上下文」而不再映射成策略名（crates/iam/src/oidc.rs:1489-1492）。
      # 会话用户名取 ID token 的 preferred_username（默认值，显式写出便于排障）。
      RUSTFS_IDENTITY_OPENID_USERNAME_CLAIM: "preferred_username"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9010/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
