services:
  gitea:
    image: gitea/gitea:latest
    container_name: gitea
    # host 网络：容器与 Mac 共用网络栈，容器内 localhost:8100 即宿主机上的 Ark IAM gateway。
    # 于是 OIDC issuer 用 http://localhost:8100/oidc —— 浏览器与容器都走 loopback，与 rustfs 一致，
    # 实现统一 SSO。代价：不再写 ports 映射，也不再加入 local_net。
    network_mode: host
    user: root
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__database__DB_TYPE=sqlite3
      - GITEA__server__DOMAIN=${GITEA_DOMAIN:-localhost}
      - GITEA__server__HTTP_PORT=3009
      - GITEA__server__ROOT_URL=http://${GITEA_DOMAIN:-localhost}:3009
      - GITEA__server__DISABLE_SSH=true
      - GITEA__security__INSTALL_LOCK=true
      - GITEA_DOMAIN=${GITEA_DOMAIN:-localhost}
      # 本地应急账号（init.sh 用这两个变量建号）。注意：Gitea 没有 [admin] 配置段，
      # 写 GITEA__admin__USERNAME/PASSWORD/EMAIL 不会生效（只会往 app.ini 塞一个无用段）。
      - GITEA_ADMIN_USERNAME=${GITEA_ADMIN_USERNAME:-gitea_admin}
      - GITEA_ADMIN_PASSWORD=${GITEA_ADMIN_PASSWORD}
      # 全局 OAuth2 客户端行为：用户名取 preferred_username、JIT 自动建号、请求 profile/email
      - GITEA__oauth2_client__USERNAME=preferred_username
      # JIT 建号（首次 OIDC 登录即以 SSO 身份建号，username 取 preferred_username）。
      # 约定：本地应急账号不得叫 admin —— IAM 的 preferred_username 就是 admin，
      # 同名会让 Gitea 落到「关联账号」页而不是直接登录。故本地账号命名为 gitea_admin。
      - GITEA__oauth2_client__ENABLE_AUTO_REGISTRATION=true
      - GITEA__oauth2_client__OPENID_CONNECT_SCOPES=openid profile email
      # Ark IAM OIDC 登录源参数（由 init.sh 通过 gitea admin auth add-oauth 创建）
      - GITEA_OIDC_NAME=${GITEA_OIDC_NAME:-ark-iam}
      - GITEA_OIDC_CLIENT_ID=${GITEA_OIDC_CLIENT_ID}
      - GITEA_OIDC_CLIENT_SECRET=${GITEA_OIDC_CLIENT_SECRET}
      - GITEA_OIDC_DISCOVERY_URL=${GITEA_OIDC_DISCOVERY_URL:-http://localhost:8100/oidc/.well-known/openid-configuration}
      - GITEA_OIDC_SCOPES=${GITEA_OIDC_SCOPES:-openid,profile,email}
      - GITEA_OIDC_GROUP_CLAIM_NAME=${GITEA_OIDC_GROUP_CLAIM_NAME:-groups}
      - GITEA_OIDC_ADMIN_GROUP=${GITEA_OIDC_ADMIN_GROUP:-gitea_admin}
      - GITEA_OIDC_RESTRICTED_GROUP=${GITEA_OIDC_RESTRICTED_GROUP:-gitea_restricted}
    volumes:
      - ./gitea-data:/data
      - ./init.sh:/init.sh:ro
    restart: unless-stopped
    entrypoint: ["/init.sh"]
