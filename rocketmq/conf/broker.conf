# Broker 配置（本地开发）
#
# 挂载到容器内 /home/rocketmq/broker.conf，由 `sh mqbroker -c` 读取。
# 不写这份文件时会用镜像自带的默认值（conf/broker.conf 或 BrokerConfig 默认值），
# 显式列出来是为了让「本地开发到底跑的是什么」可读、可改、可 review。

brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0

# 消息保留与删除
fileReservedTime = 48
deleteWhen = 04

# 单机本地开发：异步复制 + 异步刷盘，最省资源
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH

# 允许生产端自动建 topic —— golib mqaccess/rocketmq 的集成测试依赖这个行为
# （producer 先发一条 warmup 消息建出 topic，consumer 再订阅）。
autoCreateTopicEnable = true

# broker 向 NameServer 注册的地址。默认取容器内网 IP：
#   - OrbStack（当前默认引擎）宿主机可以直连容器 IP，保持默认即可；
#   - Docker Desktop / Colima 宿主机路由不到容器网段，宿主机上的客户端会连不上 broker，
#     此时取消下面一行注释并填宿主机 LAN IP。
# 注意：不要填 127.0.0.1 —— 同网络里的 proxy / dashboard 也会按这个地址连 broker，会连到它们自己。
# brokerIP1 = 192.168.1.10
